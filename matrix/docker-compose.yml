services:
  db:
    image: postgres:15-alpine
    container_name: matrix-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - matrix_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: matrix-graph
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
      - ./uploads:/data/uploads
    ports:
      - "7474:7474"
    networks:
      - matrix_net

  redis:
    image: redis:7-alpine
    container_name: matrix-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - matrix_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: matrix-mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=matrix_logs
    volumes:
      - mongo_data:/data/db
    networks:
      - matrix_net
    restart: unless-stopped
    command: ["mongod", "--quiet"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: matrix-app
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - ./app:/app
      - ./scripts:/scripts
      - rootfs_storage:/rootfs
      - ./uploads:/data/uploads
    working_dir: /app
    env_file: .env
    ports:
      - "8000:8000"
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      db:
        condition: service_healthy
      neo4j:
        condition: service_started
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - matrix_net
    healthcheck:
      test: ["CMD", "python", "manage.py", "check", "--database", "default"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    environment:
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=config.settings
      - TZ=America/Sao_Paulo
    container_name: matrix-worker
    entrypoint: []
    command: celery -A core worker --loglevel=info --concurrency=8 -Q celery,default
    volumes:
      - ./app:/app
      - rootfs_storage:/rootfs
      - ./uploads:/data/uploads
      - grype_cache:/root/.cache/grype
    env_file: .env
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - matrix_net
    privileged: true

  worker-rauc:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    environment:
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=config.settings
      - TZ=America/Sao_Paulo
    container_name: matrix-worker-rauc
    entrypoint: []
    command: celery -A core worker --loglevel=info --concurrency=4 -Q rauc
    volumes:
      - ./app:/app
      - rootfs_storage:/rootfs
      - ./uploads:/data/uploads
    env_file: .env
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - matrix_net
    privileged: true

  matrix-beat:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    environment:
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=config.settings
      - TZ=America/Sao_Paulo
    container_name: matrix-beat
    entrypoint: []
    command: celery -A core beat --loglevel=info
    volumes:
      - ./app:/app
      - rootfs_storage:/rootfs
      - ./uploads:/data/uploads
    env_file: .env
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - matrix_net

networks:
  matrix_net:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  rootfs_storage:
  mongo_data:
  grype_cache: